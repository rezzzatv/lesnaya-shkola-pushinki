<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Белочка Пушинка: лесная школа</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Comic Sans MS","Segoe UI","Trebuchet MS",sans-serif;
    background:linear-gradient(180deg,#bfe6ff 0%,#e3f6d8 55%,#b9e08f 100%);
    min-height:100vh;color:#3a2a1a;
    -webkit-user-select:none;user-select:none;
  }
  #app{max-width:780px;margin:0 auto;padding:14px 12px 40px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .dots{display:flex;flex-wrap:wrap;gap:4px;font-size:20px}
  .dot{width:30px;height:30px;border-radius:50%;background:#ffffffaa;display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid #fff}
  .dot.cur{background:#ffd76a;border-color:#e6a500;transform:scale(1.15)}
  .nutcount{font-size:26px;font-weight:bold;background:#fff;border-radius:20px;padding:4px 14px;box-shadow:0 3px 0 #d9b98a;white-space:nowrap}
  .snd{font-size:22px;background:#fff;border:none;border-radius:50%;width:42px;height:42px;cursor:pointer;box-shadow:0 3px 0 #ccc}
  .card{background:#fff;border-radius:28px;padding:20px 18px 22px;box-shadow:0 8px 0 #d9b98a,0 10px 30px #0002}
  .who{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .who .face{font-size:54px;line-height:1}
  .bubble{background:#fff6dc;border:3px solid #f0cf7a;border-radius:20px;padding:10px 14px;font-size:22px;line-height:1.35;flex:1}
  .num-label{font-size:16px;color:#a07a40;margin-bottom:4px}
  .expr{display:flex;align-items:flex-start;justify-content:center;gap:12px;font-size:50px;font-weight:bold;margin:14px 0 6px;flex-wrap:wrap}
  .expr .t{line-height:64px}
  .tree{display:inline-flex;flex-direction:column;align-items:center}
  .tree .tn{line-height:64px}
  .branch{width:84px;height:26px;stroke:#5aa83c;stroke-width:4;fill:none;stroke-linecap:round}
  .leaves{display:flex;gap:28px;font-size:30px;color:#2c8a3a}
  .box{display:inline-flex;align-items:center;justify-content:center;min-width:92px;height:64px;padding:0 10px;border:4px dashed #8ab4f8;border-radius:16px;color:#2a5bd7;background:#f2f7ff}
  .box.ok{border:4px solid #4caf50;background:#e7f8e8;color:#237a2b}
  .box.small{min-width:76px;height:52px;font-size:36px}
  .steps{margin:10px 0 4px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .step{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:bold;background:#f7f7ff;border-radius:16px;padding:6px 14px}
  .step .sn{font-size:18px;color:#8a7;font-weight:normal}
  .step.cur{background:#fff3c4;box-shadow:0 0 0 3px #ffd76a}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .btn{font-family:inherit;font-size:32px;font-weight:bold;border:none;border-radius:20px;padding:14px 10px;cursor:pointer;background:#ffe08a;color:#5a3b00;box-shadow:0 6px 0 #e0a800;transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a800}
  .btn.off{background:#eee;color:#aaa;box-shadow:0 6px 0 #ccc;pointer-events:none}
  .btn.good{background:#8be08f;box-shadow:0 6px 0 #3c9a41;color:#124d16}
  .btn.green{background:#6fd27a;color:#fff;box-shadow:0 6px 0 #3c9a41}
  .btn.blue{background:#6aa8ff;color:#fff;box-shadow:0 6px 0 #2f6fd0}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:16px auto 0}
  .pad .btn{font-size:34px;padding:12px 0;background:#e8f1ff;color:#2a4a8a;box-shadow:0 5px 0 #a9c3ee}
  .pad .btn.del{background:#ffe0e0;color:#b33;box-shadow:0 5px 0 #eaa}
  .pad .btn.go{background:#6fd27a;color:#fff;box-shadow:0 5px 0 #3c9a41}
  .fb{margin-top:14px}
  .praise{text-align:center;font-size:32px;font-weight:bold;color:#1f8a2c;animation:pop .4s}
  .soft{font-size:24px;font-weight:bold;color:#d26a00;margin-bottom:8px}
  .explain{background:#fff8ef;border:3px solid #ffc58a;border-radius:20px;padding:12px 14px;font-size:21px;line-height:1.5}
  .explain p{margin:6px 0}
  .explain b{color:#c2410c}
  .rule{background:#ffe9f1;border:3px solid #f48fb1;border-radius:16px;padding:8px 12px;margin-top:8px;text-align:center;font-weight:bold;color:#a0245a}
  .answer-reveal{font-size:26px;font-weight:bold;color:#2a5bd7;margin:6px 0}
  .next{display:block;margin:16px auto 0;font-size:30px;padding:14px 34px}
  .sticks{display:flex;gap:10px;margin:10px 0;justify-content:center;flex-wrap:wrap}
  .col{border:3px solid #e2c36a;border-radius:14px;background:#fffbe6;min-width:140px}
  .ch{background:#f7df8f;text-align:center;font-weight:bold;padding:3px 8px;border-radius:10px 10px 0 0;font-size:18px}
  .cb{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:8px;min-height:70px;font-size:28px;color:#bbb}
  .bundle{display:inline-flex;gap:1px;padding:2px;margin:3px;position:relative}
  .bundle i{display:block;width:3px;height:50px;background:#3b6fd8;border-radius:2px}
  .bundle::after{content:"";position:absolute;left:-3px;right:-3px;top:22px;height:5px;background:#6b4a22;border-radius:3px}
  .bundle.new i{background:#e0453a}
  .stick{display:inline-block;width:8px;height:50px;background:#3b6fd8;border-radius:3px;margin:3px 3px;position:relative}
  .stick.new{background:#e0453a}
  .gone i,.stick.gone{opacity:.3}
  .gone::before{content:"✖";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#e0245e;font-size:34px;z-index:2;font-weight:bold}
  .stick.gone::before{font-size:24px}
  .legend{text-align:center;font-size:16px;color:#7a6a50}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:99}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .center{text-align:center}
  h1{font-size:38px;margin:6px 0;color:#6b3d00;text-align:center}
  .big{font-size:24px;line-height:1.45}
  .cert{border:8px double #e6a500;border-radius:24px;padding:20px;background:#fffbea;text-align:center}
  .cert .medal{font-size:96px;animation:pop .6s}
  .story{font-size:58px;text-align:center;margin:4px 0}
  .tf{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .tf .btn{min-width:200px}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .mcard{font-family:inherit;border:none;border-radius:24px;padding:20px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s}
  .mcard:active{transform:translateY(4px)}
  .mcard.theory{background:#d9ecff;box-shadow:0 7px 0 #6aa8ff}
  .mcard.practice{background:#ffe9a8;box-shadow:0 7px 0 #e0a800}
  .mi{font-size:64px}.mt{font-size:34px;font-weight:bold;color:#3a2a1a}.ms{font-size:18px;color:#6a5a40}
  .home{font-family:inherit;font-size:20px;font-weight:bold;background:#fff;color:#6b3d00;border:none;border-radius:20px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #d9b98a;white-space:nowrap}
  .home:active{transform:translateY(2px)}
  .overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
  .chunk{margin:10px 0}
  .chunk.fresh{animation:pop .45s}
  .hl{color:#e0453a;background:#fff1c2;border-radius:10px;padding:0 8px}
  .tnav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
  .tnav .btn{font-size:26px;padding:12px 22px}
  /* ---- раскладка на весь экран ---- */
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .card{flex:1;display:flex;flex-direction:column}
  #ctl,.tnav.bottom{margin-top:auto}
  .prog{display:none;font-size:18px;font-weight:bold;background:#fff;border-radius:16px;padding:4px 10px;box-shadow:0 3px 0 #d9b98a}
  .sdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
  .sdots span{width:10px;height:10px;border-radius:50%;background:#e5d7b5}
  .sdots span.on{background:#e6a500}
  .pop{max-width:560px;width:100%;max-height:94vh;max-height:94dvh;overflow:auto;flex:none;animation:pop .3s}
  .pop .btn{display:block;margin:12px auto 0;font-size:24px;padding:12px 24px}
  .card.fit{flex:none;margin:auto 0}
  .chain{font-size:34px;font-weight:bold;margin:6px auto;display:flex;flex-direction:column;align-items:flex-start;width:max-content;max-width:100%}
  .chain .cl{padding:2px 10px;border-radius:12px;white-space:nowrap}
  .chain .cl.new{background:#fff3c4;box-shadow:0 0 0 3px #ffd76a;animation:pop .45s}
  .cT{color:#2a5bd7}.cU{color:#1f8a2c}.cM{color:#e0453a}.cR{color:#8a3fd1;background:#f3e8ff;border-radius:8px;padding:0 4px}
  .cnote{background:#fff8ef;border:3px solid #ffc58a;border-radius:16px;padding:8px 12px;font-size:20px;line-height:1.45;margin-top:8px}
  .chain.task{font-size:32px;margin:4px auto}
  .chain.task .cl{padding:2px 4px;line-height:1.25}
  .chain.mini{font-size:20px;margin:6px auto 2px}
  .cbox{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:46px;padding:0 4px;border:3px dashed #b9c9e8;border-radius:12px;margin:2px 3px;vertical-align:middle;background:#f7f9ff}
  .cbox.cur{border:3px solid #ffb300;background:#fff3c4;color:#2a5bd7;box-shadow:0 0 0 3px #ffe08a}
  .cbox.ok{border:3px solid #a8dcab;background:#f0fbf1}
  .chain.mini .cbox{min-width:0;height:auto;border:none;background:none;margin:0;padding:0}
  .cN{color:#3a2a1a}.cA{color:#2b1a0c;background:#fff1c2;border-radius:8px;padding:0 6px;box-shadow:0 0 0 2px #ffc94d}
  .cB{color:#9a5221}.cP{color:#8a3fd1}
  .cbox.ok.cA{color:#2b1a0c;background:#fff1c2;border-color:#ffb300}
  .chain .cl>span{display:inline-block}
  .jumper{position:fixed;z-index:450;pointer-events:none;font-weight:bold;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 #fff;will-change:transform}
  .src-glow{animation:glow .7s}
  @keyframes glow{0%,100%{filter:none}40%{filter:drop-shadow(0 0 6px #ffb300) drop-shadow(0 0 2px #ffb300)}}
  .landed{animation:land .4s}
  @keyframes land{0%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}
  .replay{font-family:inherit;font-size:16px;background:#fff;border:2px solid #f0cf7a;border-radius:14px;padding:4px 12px;margin-top:8px;cursor:pointer;color:#8a5a00}
  .clegend{text-align:center;font-size:16px;margin-top:6px;font-weight:bold}
  .namebox{display:block;width:100%;max-width:340px;margin:6px auto 4px;background:#ffe08a;border-radius:22px;padding:8px;box-shadow:0 6px 0 #e0a800}
  .nameinput{display:block;width:100%;font-family:"Comic Sans MS","Segoe UI","Trebuchet MS",sans-serif;font-weight:bold;font-size:30px;color:#6b3d00;text-align:center;
    padding:8px 10px;border:none;border-radius:16px;outline:none;background:#fffdf5;box-shadow:inset 0 3px 0 #f0cf7a;caret-color:#e0a800;-webkit-user-select:text;user-select:text}
  .nameinput::placeholder{color:#d8b878;font-weight:bold}
  .namebox:focus-within{background:#ffd24d;box-shadow:0 6px 0 #c98f00}
  /* орешки */
  .flynut{position:fixed;z-index:400;font-size:26px;pointer-events:none;will-change:transform}
  .nutcount.bump{animation:bump .35s}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  .crackwrap{position:fixed;left:50%;top:42%;z-index:400;pointer-events:none;width:0;height:0}
  .crackwrap .half{position:absolute;font-size:90px;line-height:1;left:-45px;top:-45px;animation:shakeNut .35s}
  .crackwrap .half.l{clip-path:inset(0 50% 0 0);animation:shakeNut .35s,splitL .6s .35s ease-in forwards}
  .crackwrap .half.r{clip-path:inset(0 0 0 50%);animation:shakeNut .35s,splitR .6s .35s ease-in forwards}
  .crackwrap .crackline{position:absolute;left:-18px;top:-40px;font-size:40px;opacity:0;animation:flash .3s .3s}
  @keyframes shakeNut{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
  @keyframes splitL{to{transform:translate(-60px,140px) rotate(-70deg);opacity:0}}
  @keyframes splitR{to{transform:translate(60px,140px) rotate(70deg);opacity:0}}
  @keyframes flash{0%,100%{opacity:0}50%{opacity:1}}
  .linkbtn{font-family:inherit;background:none;border:none;color:#8a6a30;font-size:16px;text-decoration:underline;margin-top:14px;cursor:pointer}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center}
  /* ---- предметы и темы ---- */
  .mcard.math{background:#d9f5d0;box-shadow:0 7px 0 #6fbf5a}
  .mcard.rus{background:#ffe0ec;box-shadow:0 7px 0 #f48fb1}
  .tlist{display:flex;flex-direction:column;gap:14px;margin-top:10px}
  .tbtn{font-family:inherit;display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:20px;padding:14px 16px;background:#fff6dc;box-shadow:0 6px 0 #e0a800;cursor:pointer;text-align:left;color:#3a2a1a}
  .tbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a800}
  .tbtn .ti{font-size:46px}.tbtn .tt{display:block;font-size:26px;font-weight:bold}.tbtn .ts{display:block;font-size:16px;color:#6a5a40}
  #ctl.wait{opacity:.6;transition:opacity .25s}
  .choices.long .btn{font-size:24px}.choices.one{grid-template-columns:1fr}
  /* ---- русский язык ---- */
  .pN,.pslot.pN{color:#2a5bd7}.pA,.pslot.pA{color:#1f8a2c}.pV,.pslot.pV{color:#d93025}
  .wcard{text-align:center;font-size:40px;font-weight:bold;margin:8px 0}
  .wcard .pic{display:block;font-size:46px;line-height:1.15}
  .wcard .ctx{color:#8a7a5a}
  .hw{background:#fff1a8;color:inherit;border-radius:12px;padding:0 8px;box-shadow:0 0 0 3px #ffd24d;animation:glowW 1.6s ease-in-out infinite}
  .hl1{background:#ffd24d;color:inherit;border-radius:8px;padding:0 3px;box-shadow:0 0 0 2px #ffb300}
  @keyframes glowW{0%,100%{box-shadow:0 0 0 3px #ffd24d}50%{box-shadow:0 0 0 5px #ffe58a,0 0 12px #ffd24d}}
  .pickhint{text-align:center;font-size:16px;color:#8a7a5a;margin-top:6px}
  /* фонетика: гласный — красный, твёрдый — синий, мягкий — зелёный */
  .sV,.pslot.sV{color:#d32f2f}.sH,.pslot.sH{color:#1e66d0}.sS,.pslot.sS{color:#1f8a2c}
  .sq{display:inline-block;width:26px;height:26px;border-radius:6px;margin:2px;vertical-align:middle;border:2px solid #0002}
  .sqV{background:#e53935}.sqH{background:#1e66d0}.sqS{background:#2e9e44}
  .tr{font-size:32px;font-weight:bold;text-align:center;margin:6px 0;letter-spacing:1px}
  .ftab{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:center;font-size:20px;margin:8px auto;max-width:420px}
  .ftab .fl{font-size:26px;font-weight:bold;text-align:center}.ftab .fs{font-weight:bold;font-size:24px}
  .ftab .new{animation:pop .5s;background:#fff3c4;border-radius:8px}
  .prow{font-size:22px;font-weight:bold;text-align:center;line-height:2}
  /* умножение */
  .groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
  .grp{display:inline-flex;flex-wrap:wrap;justify-content:center;max-width:110px;border:3px solid #e2c36a;background:#fffbe6;border-radius:18px;padding:4px 6px;font-size:26px;line-height:1.15}
  .arr{display:inline-grid;gap:4px;font-size:28px;line-height:1;background:#fffbe6;border:3px solid #e2c36a;border-radius:14px;padding:6px}
  .mtab{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:24px;font-weight:bold;max-width:320px;margin:6px auto}
  .mtab span{white-space:nowrap}
  .choices.emo .btn{font-size:20px;letter-spacing:-1px;padding:10px 6px}
  .pyth{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:420px;margin:6px auto;font-size:17px;font-weight:bold;text-align:center}
  .pyth span{background:#fffbe6;border-radius:5px;padding:3px 0}
  .pyth .ph{background:#f7df8f}.pyth .pr{background:#2a5bd7;color:#fff}.pyth .pc{background:#1f8a2c;color:#fff}
  .pyth .prl{background:#dce8ff}.pyth .pcl{background:#dff5df}.pyth .px{background:#ffd24d;box-shadow:0 0 0 2px #e0a800;color:#2b1a0c}
  .pline{font-size:26px;font-weight:bold;line-height:1.9;text-align:center;margin:8px 0}
  .pslot{display:inline-block;min-width:62px;padding:0 8px;border:3px dashed #b9c9e8;border-radius:12px;background:#f7f9ff;line-height:1.35;vertical-align:middle;margin:2px;color:#3a2a1a}
  .pslot.cur{border:3px solid #ffb300;background:#fff3c4;box-shadow:0 0 0 3px #ffe08a;color:#c2410c}
  .pslot.ok{border:3px solid #a8dcab;background:#f0fbf1}
  .pslot.new{animation:pop .5s;box-shadow:0 0 0 3px #ffd76a;background:#fff3c4}
  .explain .pline{font-size:19px;line-height:1.7}
  .explain .tr{font-size:24px}.explain .prow{font-size:18px}
  .sent{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
  .sw{display:flex;flex-direction:column;align-items:center}
  .sw .sq{font-size:17px;color:#8a7a5a}.sw .ww{font-size:32px;font-weight:bold}.sw .sl{font-size:18px;font-weight:bold}
  .pcards{display:flex;flex-direction:column;gap:10px;margin:8px 0}
  .pcard{border:3px solid;border-radius:16px;padding:6px 12px;font-size:20px;line-height:1.35}
  .pcard i,.pcard em{display:block;font-style:normal}.pcard i{font-weight:bold}.pcard em{color:#6a5a40}
  .pcard.N{border-color:#6aa8ff;background:#eef5ff}.pcard.N b{color:#2a5bd7}
  .pcard.A{border-color:#6fd27a;background:#effbef}.pcard.A b{color:#1f8a2c}
  .pcard.V{border-color:#f28b82;background:#fff0ef}.pcard.V b{color:#d93025}
  .pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
  .pairs>div{border-radius:16px;padding:8px;text-align:center;font-size:21px;line-height:1.5;background:#fffbe6;border:3px solid #e2c36a}
  .pairs h3{margin:0 0 2px;font-size:24px;color:#a0245a}
  .plist{font-size:24px;line-height:1.7;text-align:center;margin:8px 0}
  .memo{background:#fffbe6;border:3px dashed #e2c36a;border-radius:16px;padding:8px 14px;font-size:21px;margin-top:8px}
  .memo ol{margin:4px 0;padding-left:26px}
  /* ---- телефон ---- */
  @media (max-width:600px),(max-height:900px){
    #app{padding:6px 6px 8px}
    .top{margin-bottom:6px}
    .dots{display:none}.prog{display:block}
    .card{padding:10px 10px 12px;border-radius:20px;box-shadow:0 5px 0 #d9b98a}
    .num-label{display:none}
    .who{margin-bottom:6px;gap:8px}.who .face{font-size:34px}
    .bubble{font-size:16px;padding:6px 10px;border-width:2px;border-radius:14px}
    .expr{font-size:34px;margin:6px 0 2px;gap:8px}
    .expr .t,.tree .tn{line-height:46px}
    .box{min-width:64px;height:46px;border-width:3px;border-radius:12px}
    .branch{width:64px;height:18px}.leaves{font-size:22px;gap:20px}
    .box.small{min-width:56px;height:40px;font-size:26px}
    .steps{gap:6px;margin:6px 0 2px}.step{font-size:19px;padding:4px 8px;gap:6px;white-space:nowrap}.step .sn{font-size:12px}

<body>
<div id="app"></div>
<script>
/* ================= помощники ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sym=op=>op==='-'?'−':'+';
const calc=(n,op,m)=>op==='-'?n-m:n+m;
function plural(n,f){const a=n%100,b=n%10;if(a>10&&a<20)return f[2];if(b===1)return f[0];if(b>=2&&b<=4)return f[1];return f[2];}
/* имя и пол игрока: спрашиваем при первом запуске, запоминаем на устройстве */
let NAME='',GIRL=true;
try{NAME=localStorage.getItem('pl_name')||'';GIRL=localStorage.getItem('pl_girl')!=='0'}catch(e){}
const g=(f,m)=>GIRL?f:m;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- генераторы примеров (без перехода через десяток) ---------- */
function gAddU(){const t=R(1,8),u=R(1,7);return {n:10*t+u,op:'+',m:R(1,9-u)}}
function gAddT(){const t=R(1,7),u=R(1,9);return {n:10*t+u,op:'+',m:R(1,9-t)*10}}
function gSubU(){const t=R(1,9),u=R(2,9);return {n:10*t+u,op:'-',m:R(1,u)}}
function gSubT(){const t=R(3,9),u=R(1,9);return {n:10*t+u,op:'-',m:R(1,t-1)*10}}

/* ---------- картинки ---------- */
function tree(n){const T=Math.floor(n/10)*10,u=n%10;
  return `<span class="tree"><span class="tn">${n}</span><svg class="branch" viewBox="0 0 84 26"><path d="M42 3 L14 24 M42 3 L70 24"/></svg><span class="leaves"><span>${T}</span><span>${u}</span></span></span>`}
function expr(p,boxId='ans'){
  const left=p.swap?`<span class="t">${p.m}</span><span class="t">+</span>${tree(p.n)}`:`${tree(p.n)}<span class="t">${sym(p.op)}</span><span class="t">${p.m}</span>`;
  return `<div class="expr">${left}<span class="t">=</span><span class="t"><span class="box" id="${boxId}">?</span></span></div>`}
function sticks(n,o={}){
  const t=Math.floor(n/10),u=n%10;let tens='',units='';
  for(let i=0;i<t;i++)tens+=`<span class="bundle${i>=t-(o.remT||0)?' gone':''}">${'<i></i>'.repeat(10)}</span>`;
  for(let i=0;i<(o.addT||0);i++)tens+=`<span class="bundle new">${'<i></i>'.repeat(10)}</span>`;
  for(let i=0;i<u;i++)units+=`<span class="stick${i>=u-(o.remU||0)?' gone':''}"></span>`;
  for(let i=0;i<(o.addU||0);i++)units+=`<span class="stick new"></span>`;
  return `<div class="sticks"><div class="col"><div class="ch">Десятки</div><div class="cb">${tens||'—'}</div></div><div class="col"><div class="ch">Единицы</div><div class="cb">${units||'—'}</div></div></div>`}
const RULE=`<div class="rule">Единицы — с единицами, десятки — с десятками!</div>`;

/* ---------- объяснение примера ---------- */
function explain(p,pre=''){
  const {n,op,m}=p,T=Math.floor(n/10)*10,u=n%10,r=calc(n,op,m);let s=pre?`<p>${pre}</p>`:'';
  if(p.swap)s+=`<p>Поменяем местами: <b>${m} + ${n} = ${n} + ${m}</b>.</p>`;
  s+=`<p>Разложим <b>${n}</b>: <b>${T}</b> и <b>${u}</b>.</p>`;
  let vis;
  if(m<10){
    s+=`<p>${m} — это единицы. Единицы ${op==='+'?'складываем с единицами':'вычитаем из единиц'}: ${u} ${sym(op)} ${m} = <b>${calc(u,op,m)}</b>.</p>`;
    s+=`<p>Десятки не трогаем: ${T} + ${calc(u,op,m)} = <b>${r}</b>.</p>`;
    vis=sticks(n,op==='+'?{addU:m}:{remU:m});
  }else{
    s+=`<p>${m} — это ${m/10} ${plural(m/10,['десяток','десятка','десятков'])}. Десятки ${op==='+'?'складываем с десятками':'вычитаем из десятков'}: ${T} ${sym(op)} ${m} = <b>${calc(T,op,m)}</b>.</p>`;
    s+=`<p>Единицы не трогаем, просто добавляем: ${calc(T,op,m)} + ${u} = <b>${r}</b>.</p>`;
    vis=sticks(n,op==='+'?{addT:m/10}:{remT:m/10});
  }
  const leg=op==='+'?'синие — было, красные — прибавили':'зачёркнутые — убрали';
  return `<div class="explain">${s}${vis}<div class="legend">${leg}</div>${RULE}</div>`}

function stepsFor(p){
  const {n,op,m}=p,T=Math.floor(n/10)*10,u=n%10;
  if(m<10)return [{l:`Единицы: ${u} ${sym(op)} ${m} =`,a:calc(u,op,m)},{l:`${T} + ${calc(u,op,m)} =`,a:calc(n,op,m)}];
  return [{l:`Десятки: ${T} ${sym(op)} ${m} =`,a:calc(T,op,m)},{l:`${calc(T,op,m)} + ${u} =`,a:calc(n,op,m)}];
}

/* ================= задания ================= */
/* ---------- цепочка «как в тетради»: откуда приходит каждое число ---------- */
/* токен: {v:значение, k:цвет, id, from:[id из предыдущей строки]} — по from число «перепрыгивает» через «=» */
function chainSpec(n,op,m){
  const T=Math.floor(n/10)*10,u=n%10,r=calc(n,op,m),ones=m<10,o=` ${sym(op)} `;
  const x=ones?calc(u,op,m):calc(T,op,m);
  const N=(v,k,id,...from)=>({v,k,id,from});
  const L=[[N(n,'N','n'),o,N(m,'M','m0')],
           ['= ',N(T,'T','t1','n'),' + ',N(u,'U','u1','n'),o,N(m,'M','m1','m0')]];
  if(ones){
    L.push(['= ',N(T,'T','t2','t1'),' + (',N(u,'U','u2','u1'),o,N(m,'M','m2','m1'),')']);
    L.push(['= ',N(T,'T','t3','t2'),' + ',N(x,'B','x3','u2','m2')]);
    L.push(['= ',N(r,'A','r4','t3','x3')]);
  }else{
    L.push(['= (',N(T,'T','t2','t1'),o,N(m,'M','m2','m1'),') + ',N(u,'U','u2','u1')]);
    L.push(['= ',N(x,'P','x3','t2','m2'),' + ',N(u,'U','u3','u2')]);
    L.push(['= ',N(r,'A','r4','x3','u3')]);
  }
  return {L,T,u,r,x,ones,o:sym(op),n,m,op};
}
const CCLS={N:'cN',T:'cT',U:'cU',M:'cM',R:'cR',B:'cB',P:'cP',A:'cA'};
const tokSpan=(tk,extra='')=>`<span class="${CCLS[tk.k]}${extra}" data-tid="${tk.id}"${tk.from.length?` data-from="${tk.from.join(',')}"`:''}>${tk.v}</span>`;

/* прыжок: копии чисел-источников летят по дуге в число-цель */
function jumpSound(merge){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const c=actx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(merge?500:380,t);o.frequency.exponentialRampToValueAtTime(merge?1300:900,t+0.16);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.22);}catch(e){}}
function jumpInto(dst,delay=0){
  const line=dst.closest('.cl'),prev=line&&line.previousElementSibling;if(!prev||!dst.dataset.from)return;
  const srcs=dst.dataset.from.split(',').map(id=>prev.querySelector(`[data-tid="${id}"]`)).filter(Boolean);
  if(!srcs.length)return;
  dst.style.visibility='hidden';
  setTimeout(()=>{
    const d=dst.getBoundingClientRect();let left=srcs.length;const merge=srcs.length>1;
    jumpSound(merge);
    srcs.forEach(s=>{
      const r=s.getBoundingClientRect(),cs=getComputedStyle(s);
      const f=document.createElement('div');f.className='jumper';f.textContent=s.textContent;
      f.style.cssText+=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;font-size:${cs.fontSize};color:${cs.color}`;
      document.body.appendChild(f);
      s.classList.add('src-glow');setTimeout(()=>s.classList.remove('src-glow'),700);
      const dx=d.left+d.width/2-(r.left+r.width/2),dy=d.top+d.height/2-(r.top+r.height/2);
      const dc=getComputedStyle(dst).color;
      const a=f.animate([{transform:'translate(0,0) scale(1)',color:cs.color},{transform:`translate(${dx/2}px,${dy/2-55}px) scale(1.35)`,color:cs.color,offset:.5},
        {transform:`translate(${dx}px,${dy}px) scale(${merge?.6:1})`,color:merge?dc:cs.color}],{duration:650,easing:'ease-in-out'});
      a.onfinish=()=>{f.remove();if(--left===0){dst.style.visibility='';dst.classList.remove('landed');void dst.offsetWidth;dst.classList.add('landed');
        if(merge)tones([880,1175]);}};
    });
  },delay);
}
function animateLine(line){[...line.querySelectorAll('[data-from]')].forEach((el,i)=>jumpInto(el,250+i*700));}

/* ---------- задание-цепочка: ребёнок вписывает числа в окошки ---------- */
function chainTask(p,given){
  const c=chainSpec(p.n,p.op,p.m),{T,u,r,x,o,n,m}=c;
  const dec=`Разложи ${n} на десятки и единицы: ${n} = <b>${T}</b> + <b>${u}</b>. Оба числа перепрыгивают через «=».`;
  const H=c.ones?{t1:dec,u1:dec,
      t2:`Десятки <b>${T}</b> перепрыгивают через «=» и встают за скобками. Не теряем!`,
      u2:`В скобки перепрыгивают <b>единицы</b>: сначала ${u}, потом ${m}.`,
      m2:`Число <b>${m}</b> тоже перепрыгивает в скобки — его нельзя потерять!`,
      t3:`Десятки <b>${T}</b> снова перепрыгивают через «=» — не теряем!`,
      x3:`${u} и ${m} из скобок соединяются в одно число: ${u} ${o} ${m} = <b>${x}</b>.`,
      r4:`Последний прыжок: ${T} и ${x} соединяются: ${T} + ${x} = <b>${r}</b>.`}
    :{t1:dec,u1:dec,
      t2:`В скобки перепрыгивают <b>десятки</b>: сначала ${T}, потом ${m}.`,
      m2:`Число <b>${m}</b> перепрыгивает в скобки к десяткам — его нельзя потерять!`,
      u2:`Единицы <b>${u}</b> перепрыгивают за скобки и ждут. Не теряем!`,
      x3:`${T} и ${m} из скобок соединяются в одно число: ${T} ${o} ${m} = <b>${x}</b>.`,
      u3:`Единицы <b>${u}</b> снова перепрыгивают через «=» — не теряем!`,
      r4:`Последний прыжок: ${x} и ${u} соединяются: ${x} + ${u} = <b>${r}</b>.`};
  const slots=[];
  c.L.forEach((line,li)=>line.forEach(tk=>{if(typeof tk==='string'||li===0)return;
    if(li===1&&(given||tk.k==='M'))return;tk.slot=slots.length;slots.push({a:tk.v,k:tk.k,id:tk.id,hint:H[tk.id]});}));
  const t={type:'steps',chain:c,face:given?'🦉':'🐻',
    q:given?'Запиши цепочкой! Числа перепрыгивают через «=» — впиши их в окошки. Ничего не теряем!':'Сам разложи число и допиши цепочку! Все числа должны перепрыгнуть 😉',
    html:'',steps:slots,res:r};
  t.exp=()=>`<div class="explain"><p>${slots[Math.min(st.step,slots.length-1)].hint}</p><div class="chain mini">${chainHTML(t,99,true)}</div>${RULE}</div>`;
  return t;
}
function chainHTML(t,upto,all){
  return t.chain.L.map(line=>`<div class="cl">${line.map(tk=>{
    if(typeof tk==='string')return tk;
    if(tk.slot===undefined)return tokSpan(tk);
    const from=tk.from.length?` data-from="${tk.from.join(',')}"`:'';
    if(all||tk.slot<upto)return `<span class="cbox ok ${CCLS[tk.k]}" data-tid="${tk.id}"${from}>${tk.v}</span>`;
    if(tk.slot===upto)return `<span class="cbox cur" id="ans" data-tid="${tk.id}">${st.input||'?'}</span>`;
    return `<span class="cbox" data-tid="${tk.id}"></span>`;}).join('')}</div>`).join('');
}

function buildTasks(){
  const L=[];
  // 1. Из чего состоит число
  {const t=R(2,9);let u=R(1,9);while(u===t)u=R(1,9);const n=10*t+u,T=10*t;
   const opts=shuffle([`${T} + ${u}`,`${u*10} + ${t}`,`${T} + ${u*10}`,`${t} + ${u*10}`]);
   L.push({type:'choice',face:'🐿️',q:`Я сложила палочки в пучки. В каждом пучке — 10 палочек. Какое число получилось и из чего оно состоит?`,
     html:sticks(n)+`<div class="expr"><span class="t">${n} = ?</span></div>`,opts,ans:`${T} + ${u}`,
     exp:()=>`<div class="explain"><p>Пучки — это <b>десятки</b>: ${t} ${plural(t,['пучок','пучка','пучков'])} = <b>${T}</b>.</p><p>Отдельные палочки — <b>единицы</b>: <b>${u}</b>.</p><p>Значит, ${n} = <b>${T} + ${u}</b>.</p></div>`});}
  // 2-5. По шагам
  const sq=[[gAddU,'Сначала единицы, потом всё вместе!'],[gSubT,'Вычитаем десятки!']];
  for(const [g,hint] of sq){const p=g();
    L.push({type:'steps',face:'🐿️',q:`Реши по шагам, как в учебнике. ${hint}`,html:expr(p,'final'),steps:stepsFor(p),exp:()=>explain(p),res:calc(p.n,p.op,p.m)});}
  // Цепочки «как в тетради»: вставь числа в скобки и за скобки
  [[gAddU,true],[gAddT,true],[gSubU,false],[gSubT,false]].forEach(([g,given])=>L.push(chainTask(g(),given)));
  // 6. В уме
  {const p=pick([gAddU,gSubU,gAddT,gSubT])();
   L.push({type:'num',face:'🦉',q:'Совёнок Угу просит: посчитай в уме!',html:expr(p),ans:calc(p.n,p.op,p.m),exp:()=>explain(p)});}
  // 7. Выбор ответа
  {const p=gSubT(),r=calc(p.n,p.op,p.m);
   const set=new Set([r]);[p.n-p.m/10,p.n+p.m,r+10,r-10,r+1,r-1].forEach(x=>{if(set.size<4&&x>0&&x<100)set.add(x)});
   L.push({type:'choice',face:'🦊',q:'Лисичка нашла четыре ответа. Какой правильный?',html:expr(p),opts:shuffle([...set].map(String)),ans:String(r),exp:()=>explain(p)});}
  // 8. Хитрый пример (однозначное первым)
  {const p=gAddU();p.swap=true;
   L.push({type:'num',face:'🐰',q:'Хитрый пример от зайчика! Подсказка: поменяй числа местами.',html:expr(p),ans:calc(p.n,p.op,p.m),exp:()=>explain(p)});}
  // 9. Найди ошибку
  {const p=pick([gAddU,gAddT,gSubU,gSubT])(),r=calc(p.n,p.op,p.m);
   let wrong;if(p.m<10)wrong=p.op==='+'?p.n+p.m*10:p.n-p.m*10;else wrong=p.op==='+'?p.n+p.m/10:p.n-p.m/10;
   if(wrong<=0||wrong>=100)wrong=p.m<10?(p.op==='+'?r+10:r-10):(p.op==='+'?r+1:r-1);
   const ok=Math.random()<0.5,shown=ok?r:wrong;
   L.push({type:'tf',face:'🦔',q:'Ёжик Колючкин решил пример. Он прав или ошибся?',
     html:`<div class="expr"><span class="t">${p.n} ${sym(p.op)} ${p.m} = ${shown}</span></div>`,isOk:ok,r,
     exp:()=>explain(p,ok?'Ёжик решил <b>правильно</b>!':`Ёжик перепутал десятки и единицы. Правильно: <b>${r}</b>.`)});}
  // 10. Задача
  {let p,text;
   if(Math.random()<0.5){p=pick([gAddU,gAddT])();
     text=`Пушинка собрала ${p.n} ${plural(p.n,['орешек','орешка','орешков'])}, а потом нашла ещё ${p.m}. Сколько орешков стало у Пушинки?`;}
   else{p=pick([gSubU,gSubT])();
     text=`В кладовке у Пушинки ${p.n} ${plural(p.n,['шишка','шишки','шишек'])}. ${p.m} ${plural(p.m,['шишку','шишки','шишек'])} она подарила ёжику. Сколько шишек осталось?`;}
   const r=calc(p.n,p.op,p.m);
   L.push({type:'num',face:'🐿️',q:'Задача!',html:`<div class="bubble" style="margin:6px 0">${text}</div><div class="expr"><span class="t">Ответ:</span><span class="box" id="ans">?</span></div>`,ans:r,
     exp:()=>explain(p,`${p.op==='+'?'«Нашла ещё» — стало <b>больше</b>, значит, <b>складываем</b>':'«Подарила» — стало <b>меньше</b>, значит, <b>вычитаем</b>'}: ${p.n} ${sym(p.op)} ${p.m}.`)});}
  // 11. Удобный способ
  {const a=R(1,9),c=10-a;let b=R(2,9);while(b===a||b===c)b=R(2,9);
   L.push({type:'num',face:'🐻',q:'Мишка считает удобным способом. Найди два числа, которые вместе дают 10!',
     html:`<div class="expr"><span class="t">${a} + ${b} + ${c} =</span><span class="box" id="ans">?</span></div>`,ans:a+b+c,
     exp:()=>`<div class="explain"><p>Ищем «числа-друзья», которые вместе дают 10: <b>${a} + ${c} = 10</b>.</p><p>Потом к 10 прибавляем ${b}: 10 + ${b} = <b>${10+b}</b>.</p><p>Так считать легче, чем по порядку!</p></div>`});}
  // 12. Финальная задача по шагам
  {const z=R(3,8),more=R(2,5),b=z+more;
   L.push({type:'steps',face:'🏆',q:`Последнее задание! На поляне играют ${z} ${plural(z,['зайчонок','зайчонка','зайчат'])}, а бельчат — на ${more} больше. Сколько всего зверят на поляне?`,
     html:'',steps:[{l:`Сколько бельчат? ${z} + ${more} =`,a:b},{l:`Сколько всего? ${z} + ${b} =`,a:z+b}],
     exp:()=>`<div class="explain"><p>«На ${more} больше» — значит, столько же, сколько зайчат, и ещё ${more}: ${z} + ${more} = <b>${b}</b> бельчат.</p><p>«Всего» — складываем зайчат и бельчат: ${z} + ${b} = <b>${z+b}</b> зверят.</p></div>`});}
  return L;
}

/* ================= звук и конфетти ================= */
let actx=null,soundOn=true;
function tones(fs,type='triangle'){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  fs.forEach((f,i)=>{const t=actx.currentTime+i*0.11,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.35)})}catch(e){}}
const yay=()=>tones([523,659,784,1047]);
/* шум для звуков орешков */
function noise(t,dur,freq,q,vol){const c=actx,len=Math.max(1,Math.floor(c.sampleRate*dur)),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start(t);}
function knock(t,freq,vol){const c=actx,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*0.6,t+0.06);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.08);}
/* орешки сыплются в дупло: дробный деревянный стук */
function rattle(){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const now=actx.currentTime;
  for(let k=0;k<9;k++){const t=now+k*0.035+Math.random()*0.03,v=0.5*(1-k/11);
    knock(t,700+Math.random()*700,v*0.5);noise(t,0.035,2500+Math.random()*2500,4,v*1.2);}}catch(e){}}
/* ошибка: треск раскалывающегося орешка и грустное «уа-уа» */
function oops(){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const c=actx,now=c.currentTime;
  noise(now,0.09,1800,0.8,1.4);noise(now+0.05,0.12,900,1,0.9);knock(now,180,0.5);
  [[466,415,0.25],[415,349,0.25],[392,294,0.6]].forEach(([f1,f2,d],i)=>{const t=now+0.3+i*0.3,o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+0.05)});}catch(e){}}

  d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.4+Math.random()*1.4)+'s';d.style.animationDelay=Math.random()*0.4+'s';

/* ================= теория ================= */
function plainExpr(s){return `<div class="expr"><span class="t">${s}</span></div>`}
function treeExpr(p,res){const left=`${tree(p.n)}<span class="t">${sym(p.op)}</span><span class="t">${p.m}</span>`;
  return `<div class="expr">${left}<span class="t">=</span><span class="t"><span class="box ${res!==undefined?'ok':''}">${res??'?'}</span></span></div>`}
/* запись в тетради цепочкой: числа перепрыгивают через «=», ни одно не теряется */
function chainSlides(n,op,m){
  const c=chainSpec(n,op,m),{T,u,r,x,o}=c;
  const cT=v=>`<span class="cT">${v}</span>`,cU=v=>`<span class="cU">${v}</span>`,cM=v=>`<span class="cM">${v}</span>`,cR=v=>`<span class="cR">${v}</span>`;
  const notes=[null,
    `🦘 Число ${n} разложилось на ${cT(T)} и ${cU(u)} — и <b>все числа перепрыгнули</b> через «=». Проверим: ${cT(T)} ✔ ${cU(u)} ✔ ${cM(m)} ✔ — ничего не потеряли!`,
    c.ones?`🦘 Снова прыжок! Все числа на месте: ${cT(T)} ✔ ${cU(u)} ✔ ${cM(m)} ✔. Единицы прыгнули <b>в скобки</b> — их считаем первыми.`
          :`🦘 Снова прыжок! Все числа на месте: ${cT(T)} ✔ ${cM(m)} ✔ ${cU(u)} ✔. Десятки прыгнули <b>в скобки</b>, а ${cU(u)} ждёт за скобками.`,
    c.ones?`💫 ${cU(u)} и ${cM(m)} из скобок <b>соединились</b> в <span class="cB">${x}</span>. А ${cT(T)} перепрыгнуло дальше — его не теряем!`
          :`💫 ${cT(T)} и ${cM(m)} из скобок <b>соединились</b> в <span class="cP">${x}</span>. А ${cU(u)} перепрыгнуло дальше — его не теряем!`,
    c.ones?`💫 ${cT(T)} и <span class="cB">${x}</span> соединились — вот и ответ: <span class="cA">${r}</span> 🎉`
          :`💫 <span class="cP">${x}</span> и ${cU(u)} соединились — вот и ответ: <span class="cA">${r}</span> 🎉`];
  const res=[];
  for(let k=1;k<c.L.length;k++){
    const ls=c.L.slice(0,k+1).map((line,i)=>`<div class="cl${i===k?' new':''}">${line.map(tk=>typeof tk==='string'?tk:tokSpan(tk)).join('')}</div>`).join('');
    res.push(`<p class="big"><b>Как записать в тетради</b> — следи за прыжками:</p><div class="chain theory">${ls}</div><div class="cnote">${notes[k]}</div>`
      +`<div class="center"><button class="replay" onclick="replayJump()">🔁 Ещё раз прыжок</button></div>`);
  }
  return res;
}

   <div class="tnav bottom">${(L_i>0||L_k>0)?`<button class="btn" onclick="theoryBack()">👈 Назад</button>`:'<span></span>'}<button class="btn green" onclick="${nextFn}">${nextLabel}</button></div></div>`;
  const nl=document.querySelector('.chain.theory .cl.new');
  if(nl){nl.querySelectorAll('[data-from]').forEach(e=>e.style.visibility='hidden');setTimeout(()=>animateLine(nl),300)}
}
function theoryNext(){L_k++;tones([660,880]);renderTheory()}
function theoryBack(){if(L_k>0){L_k--;renderTheory()}else{L_i--;L_k=LESSONS[L_i].chunks.length-1;renderTheory()}}

function begin(){tasks=CUR.build();idx=0;nuts=0;results=[];showTask()}

/* защита от случайных повторных нажатий: после смены кнопок внизу они немного «спят» */
let guardUntil=0;
function guard(ms){guardUntil=Date.now()+ms;const c=document.getElementById('ctl');if(!c)return;c.classList.add('wait');
  setTimeout(()=>{if(Date.now()>=guardUntil){const k=document.getElementById('ctl');if(k)k.classList.remove('wait')}},ms+20);}
document.addEventListener('click',e=>{if(Date.now()<guardUntil&&e.target.closest&&e.target.closest('#ctl')){e.stopPropagation();e.preventDefault()}},true);
function showTask(){
  const t=tasks[idx];st={tries:0,step:0,err:false,input:'',done:false,lock:false};
  app.innerHTML=header()+`<div class="card">
    <div class="num-label">Задание ${idx+1} из ${tasks.length}</div>
    <div class="who"><div class="face">${t.face}</div><div class="bubble">${t.q}</div></div>
    <div id="main">${t.html}</div><div id="stepsBox"></div><div id="fb" class="fb"></div><div id="ctl"></div></div>`;
  if(t.type==='choice')renderChoices();
  else if(t.type==='tf')renderTF();
  else if(t.parse)renderSteps();
  else{if(t.type==='steps')renderSteps();renderPad();}
  guard(800);
}

/* --- выбор ответа --- */
function renderChoices(){const t=tasks[idx];
  const oc=t.cls??optCls(t.opts);
  document.getElementById('ctl').innerHTML=`${oc?'<div class="pickhint">👇 Выбери правильный ответ</div>':''}<div class="choices${oc}">${t.opts.map((o,i)=>`<button class="btn" data-i="${i}">${o}</button>`).join('')}</div>`;
  document.querySelectorAll('.choices .btn').forEach(b=>b.onclick=()=>{if(st.done)return;
    if(b.textContent===t.ans){b.classList.add('good');document.querySelectorAll('.choices .btn').forEach(x=>{if(x!==b)x.classList.add('off')});win();}
    else{b.classList.add('off','shake');miss(t.ans,()=>{document.querySelectorAll('.choices .btn').forEach(x=>{if(x.textContent===t.ans)x.classList.add('good');else x.classList.add('off')})});}
  });}

/* --- прав / не прав --- */
function renderTF(){const t=tasks[idx];
  document.getElementById('ctl').innerHTML=`<div class="tf"><button class="btn green" id="yes">✅ Прав</button><button class="btn blue" id="no">❌ Ошибся</button></div>`;
  const h=say=>{if(st.done)return;document.getElementById('yes').classList.add('off');document.getElementById('no').classList.add('off');
    if(say===t.isOk){win(t.isOk?'':`<div class="soft" style="text-align:center">Ёжик ошибся. Правильно: ${t.r}</div>`)}else{st.tries=1;miss(null,null,true)}};
  document.getElementById('yes').onclick=()=>h(true);document.getElementById('no').onclick=()=>h(false);}

/* --- шаги --- */
function renderSteps(){const t=tasks[idx];
  if(t.parse)return renderParse();
  if(t.chain){document.getElementById('stepsBox').innerHTML=`<div class="chain task">${chainHTML(t,st.done?99:st.step,st.done)}</div>`;return}
  let h='<div class="steps">';
  t.steps.forEach((s,i)=>{if(i>st.step)return;const done=i<st.step||st.done;
    h+=`<div class="step ${!done?'cur':''}"><span class="sn">Шаг ${i+1}.</span>${s.l}<span class="box small ${done?'ok':''}" ${!done?'id="ans"':''}>${done?s.a:(st.input||'?')}</span></div>`});
  document.getElementById('stepsBox').innerHTML=h+'</div>';}

/* --- цифровая клавиатура --- */
function renderPad(){
  const keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  document.getElementById('ctl').innerHTML=`<div class="pad">${keys.map(k=>`<button class="btn ${k==='⌫'?'del':k==='✓'?'go':''}" data-k="${k}">${k}</button>`).join('')}</div>`;
  document.querySelectorAll('.pad .btn').forEach(b=>b.onclick=()=>key(b.dataset.k));}
function key(k){if(st.done||st.lock||document.getElementById('popbox'))return;const box=document.getElementById('ans');if(!box)return;
  if(k==='⌫')st.input=st.input.slice(0,-1);
  else if(k==='✓')return check();
  else if(st.input.length<3)st.input+=k;
  box.textContent=st.input||'?';}
document.addEventListener('keydown',e=>{if(!tasks||!st)return;const t=tasks[idx];if(!t||t.parse||(t.type!=='num'&&t.type!=='steps'))return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('✓');});

function check(){const t=tasks[idx];const box=document.getElementById('ans');
  if(!st.input){box.classList.add('shake');setTimeout(()=>box.classList.remove('shake'),400);return}
  const v=parseInt(st.input,10);
  const need=t.type==='steps'?t.steps[st.step].a:t.ans;
  if(v===need){
    if(t.type==='steps'&&st.step<t.steps.length-1){
      st.step++;st.input='';st.tries=0;renderSteps();
      if(t.chain){const el=document.querySelector(`#stepsBox [data-tid="${t.steps[st.step-1].id}"]`);if(el)jumpInto(el,0);else tones([660,880]);
        document.getElementById('fb').innerHTML=`<div class="praise" style="font-size:20px">Верно! Число на месте ✔</div>`;return}
      tones([660,880]);
      document.getElementById('fb').innerHTML=`<div class="praise">Верно! Следующий шаг 👉</div>`;return}
    box.classList.add('ok');win();
  }else{
    box.classList.add('shake');setTimeout(()=>box.classList.remove('shake'),400);
    miss(need,()=>{box.textContent=need;box.classList.add('ok');});
  }}

/* --- верно --- */
function win(extra=''){const t=tasks[idx];st.done=true;
  const g=st.err?1:2;nuts+=g;results[idx]=st.err?'help':'star';
  if(t.type==='steps'){renderSteps();const f=document.getElementById('final');if(f){f.textContent=t.res;f.classList.add('ok')}
    if(t.chain){const el=document.querySelector('#stepsBox [data-tid="r4"]');if(el)jumpInto(el,0)}}
  yay();confetti(st.err?14:26);
  document.getElementById('fb').innerHTML=`<div class="praise">${praise()}<br><span style="font-size:24px">+${g} 🌰</span></div>${extra}`;
  flyNuts(g);
  nextBtn();}

/* --- ошибка --- */
function miss(correct,reveal,final=false){const t=tasks[idx];const ex=t.exp();st.err=true;st.tries++;st.input='';oops();crackNut();
  const fb=document.getElementById('fb');
  if(st.tries===1&&!final){
    const b=document.getElementById('ans');if(b)b.textContent='?';
    fb.innerHTML=`<div class="soft" style="text-align:center;color:#2a5bd7">Попробуй ещё раз! 💪</div>`;
    popup(`<div class="soft">${pick(SOFT)}</div>${ex}`,'Понятно! Ещё раз 💪');
  }else{
    if(reveal)reveal();
    if(t.type==='steps'&&st.step<t.steps.length-1){ // показываем ответ шага и идём дальше
      st.step++;st.tries=0;renderSteps();
      fb.innerHTML=`<div class="answer-reveal" style="text-align:center">Было: ${correct}. Идём дальше! 👉</div>`;
      popup(`<div class="answer-reveal">Правильно было: ${correct}</div>${ex}`,'Понятно 👍');return}
    st.done=true;results[idx]='learn';
    if(t.type==='steps'){renderSteps();const f=document.getElementById('final');if(f){f.textContent=t.res;f.classList.add('ok')}}
    fb.innerHTML=`<div class="answer-reveal" style="text-align:center">${correct!==null?`Правильный ответ: ${correct}`:'В следующий раз получится! 😊'}</div>`;
    popup(`${correct!==null?`<div class="answer-reveal">Правильный ответ: ${correct}</div>`:`<div class="soft">Давай посмотрим, как было на самом деле:</div>`}${ex}<div class="soft" style="color:#2a5bd7;margin-top:8px">Теперь ты знаешь, как решать! 😊</div>`,'Понятно 👍');
    nextBtn();
  }}

function popup(html,btn){
  // сначала орешек раскалывается, потом появляется окно с объяснением
  const d=document.createElement('div');d.className='overlay';d.id='popbox';d.style.background='transparent';
  document.body.appendChild(d);
  setTimeout(()=>{d.style.background='';
    d.innerHTML=`<div class="card pop">${html}<button class="btn green">${btn}</button></div>`;
    d.querySelector('.btn').onclick=()=>{d.remove();guard(400)};},950);}

/* --- орешки летят в счётчик --- */
let shownNuts=0;
function flyNuts(count){
  const from=(document.querySelector('.praise')||document.getElementById('fb')).getBoundingClientRect();
  const to=document.getElementById('nutc');if(!to){shownNuts=nuts;return}
  for(let i=0;i<count;i++)setTimeout(()=>{
    const tr=to.getBoundingClientRect();
    const x0=from.left+from.width/2-18+(i?30:-30),y0=from.top+10;
    const x1=tr.left+12,y1=tr.top;
    const n=document.createElement('div');n.className='flynut';n.textContent='🌰';
    n.style.left=x0+'px';n.style.top=y0+'px';document.body.appendChild(n);
    const dx=x1-x0,dy=y1-y0;
    const a=n.animate([
      {transform:'translate(0,0) scale(1.6) rotate(0deg)'},
      {transform:`translate(${dx*0.35}px,${dy*0.35-90}px) scale(1.9) rotate(200deg)`,offset:0.4},
      {transform:`translate(${dx}px,${dy}px) scale(.9) rotate(420deg)`}],{duration:850,easing:'ease-in'});
    a.onfinish=()=>{n.remove();shownNuts=Math.min(shownNuts+1,nuts);
      const c=document.getElementById('nutn');if(c)c.textContent=shownNuts;
      to.classList.remove('bump');void to.offsetWidth;to.classList.add('bump');
      rattle();};
  },300+i*380);}

/* --- орешек раскалывается --- */
function crackNut(){
  const w=document.createElement('div');w.className='crackwrap';
  w.innerHTML=`<span class="half l">🌰</span><span class="half r">🌰</span><span class="crackline">⚡</span>`;
  document.body.appendChild(w);setTimeout(()=>w.remove(),1300);}

function nextBtn(){const last=idx===tasks.length-1;
  document.getElementById('ctl').innerHTML=`<button class="btn green next" id="nx">${last?'Узнать результат 🏆':'Дальше ➜'}</button>`;
  document.getElementById('nx').onclick=()=>{if(last)finish();else{idx++;showTask();window.scrollTo({top:0,behavior:'smooth'})}};
  guard(1000);}

/* --- финал --- */
function finish(){const max=tasks.length*2;
  let medal,title;
  if(nuts>=max-4){medal='🥇';title='Золотая белочка!'}
  else if(nuts>=max*0.6){medal='🥈';title='Серебряная белочка!'}
  else{medal='🥉';title='Смелая белочка!'}
  const stars=results.filter(r=>r==='star').length;
  app.innerHTML=`<div class="card fit"><div class="cert">
    <div style="font-size:26px;letter-spacing:4px;color:#b07a00">ГРАМОТА</div>
    <div class="medal">${medal}</div>
    <h1>${title}</h1>
    <p class="big"><b>${esc(NAME)}</b> ${g("помогла","помог")} белочке Пушинке и ${g("собрала","собрал")}<br><span style="font-size:44px">🌰 ${nuts}</span> из ${max} орешков!</p>
    <p class="big">С первого раза решено: <b>${stars}</b> из ${tasks.length} ⭐</p>
    <p class="big">${nuts>=max-4?CUR.master:`Ты отлично ${g('постаралась','постарался')}! Сыграй ещё раз — будет ещё лучше! 💪`}</p>
    ${CUR.rule}
    <div class="tnav" style="justify-content:center;flex-wrap:wrap"><button class="btn" onclick="startScreen()">🏠 В меню</button><button class="btn" onclick="openTheory(0)">📖 Повторить теорию</button><button class="btn green" onclick="begin()">Играть ещё раз 🔄</button></div>
    <div style="font-size:16px;color:#999;margin-top:6px">Каждый раз будут новые задания!</div>
  </div></div>`;
  yay();confetti(60);setTimeout(()=>confetti(40),900);}

/* ================= РУССКИЙ ЯЗЫК: морфологический разбор (2 класс) ================= */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const optCls=o=>{if(!o.some(x=>/[а-яё]/i.test(x)))return '';const m=Math.max(...o.map(x=>x.length));return m>12?' long one':' long'};
const PN={N:'существительное',A:'прилагательное',V:'глагол'},PS={N:'сущ.',A:'прил.',V:'гл.'},PC={N:'pN',A:'pA',V:'pV'};
/* существительные: слово, вопрос, собственное?, число, картинка */
const NOUNS=[['ёжик','кто?',0,'ед','🦔'],['кошка','кто?',0,'ед','🐱'],['белка','кто?',0,'ед','🐿️'],['котёнок','кто?',0,'ед','🐱'],['зайцы','кто?',0,'мн','🐰'],['птицы','кто?',0,'мн','🐦'],['дети','кто?',0,'мн','🧒'],['рыбки','кто?',0,'мн','🐟'],
  ['мяч','что?',0,'ед','⚽'],['книга','что?',0,'ед','📕'],['дом','что?',0,'ед','🏠'],['шишки','что?',0,'мн','🌲'],['яблоки','что?',0,'мн','🍎'],['санки','что?',0,'мн','🛷'],['карандаши','что?',0,'мн','✏️'],
  ['Мурзик','кто?',1,'ед','🐱'],['Шарик','кто?',1,'ед','🐶'],['Пушинка','кто?',1,'ед','🐿️'],['Москва','что?',1,'ед','🏙️'],['Волга','что?',1,'ед','🌊'],['Байкал','что?',1,'ед','🏞️']]
  .map(([w,q,p,num,pic])=>({kind:'N',w,q,anim:q==='кто?',prop:!!p,num,pic}));
/* глаголы: слово, число, кто действует, картинка */
const VERBS=[['прыгает','ед','белка','🐿️'],['бежит','ед','ёжик','🦔'],['поёт','ед','птичка','🐦'],['плывёт','ед','рыбка','🐟'],['спит','ед','котёнок','😴'],['рисует','ед','художник','🎨'],
  ['летят','мн','птицы','🐦'],['играют','мн','дети','⚽'],['растут','мн','грибы','🍄'],['читают','мн','ребята','📚'],['падают','мн','листья','🍂']]
  .map(([w,num,ctx,pic])=>({kind:'V',w,q:num==='ед'?'что делает?':'что делают?',num,ctx,pic}));
/* прилагательные: слово, вопрос, с каким словом дружит, картинка */
const ADJS=[['рыжая','какая?','белка','🐿️'],['пушистый','какой?','котёнок','🐱'],['колючий','какой?','ёжик','🦔'],['большой','какой?','дом','🏠'],['зелёное','какое?','дерево','🌳'],['синее','какое?','море','🌊'],['тёплое','какое?','солнышко','☀️'],
  ['весёлые','какие?','дети','🧒'],['спелые','какие?','яблоки','🍎'],['тёплые','какие?','варежки','🧤'],['золотая','какая?','осень','🍂']]
  .map(([w,q,ctx,pic])=>({kind:'A',w,q,num:q==='какие?'?'мн':'ед',ctx,pic}));
const byW=(pool,w)=>pool.find(o=>o.w===w);
const SENTS=[['рыжая','белка','прыгает'],['колючий','ёжик','бежит'],['весёлые','дети','играют'],['пушистый','котёнок','спит']]
  .map(([a,n,v])=>[byW(ADJS,a),byW(NOUNS,n),byW(VERBS,v)]);
const numL=o=>o.num==='ед'?'ед. ч.':'мн. ч.';
const RRULE=`<div class="rule">Сначала задай вопрос — он подскажет часть речи!</div>`;
/* что пишем в разборе — по порядку плана */
function vals(o){return o.kind==='N'?[PS.N,o.q,o.anim?'одуш.':'неодуш.',o.prop?'собств.':'нариц.',numL(o)]:[PS[o.kind],o.q,numL(o)]}
function slotOpts(o,i){if(i===0)return ['сущ.','прил.','гл.'];
  if(i===1)return o.kind==='N'?['кто?','что?']:o.kind==='V'?['что делает?','что делают?']:['какой?','какая?','какое?','какие?'];
  if(o.kind==='N'&&i===2)return ['одуш.','неодуш.'];if(o.kind==='N'&&i===3)return ['собств.','нариц.'];return ['ед. ч.','мн. ч.']}
/* подсказка к конкретному окошку разбора */
function hint(o,i){const W=`«${o.w}»`,last=vals(o).length-1;
  if(i===0)return o.kind==='N'?`${W} — это предмет: (<b>${o.q}</b>) ${o.w}. Значит, это <b class="pN">существительное</b> — пишем «сущ.».`
    :o.kind==='V'?`${W} — это действие: ${o.ctx} (<b>${o.q}</b>) ${o.w}. Значит, это <b class="pV">глагол</b> — пишем «гл.».`
    :`${W} — это признак предмета: ${o.ctx} (<b>${o.q}</b>) ${o.w}. Значит, это <b class="pA">прилагательное</b> — пишем «прил.».`;
  if(i===1)return o.kind==='N'?(o.anim?`${cap(o.w)} — человек или животное. Спрашиваем <b>кто?</b>`:`${cap(o.w)} — не человек и не животное. Спрашиваем <b>что?</b>`)
    :`Вопрос задаём от слова «${o.ctx}»: ${o.ctx} (<b>${o.q}</b>) ${o.w}.`;
  if(o.kind==='N'&&i===2)return o.anim?`Отвечает на вопрос <b>кто?</b> — значит, <b>одушевлённое</b> («одуш.»).`:`Отвечает на вопрос <b>что?</b> — значит, <b>неодушевлённое</b> («неодуш.»).`;
  if(o.kind==='N'&&i===3)return o.prop?`${cap(o.w)} — это имя, кличка или название. Пишется с большой буквы — <b>собственное</b> («собств.»).`:`${cap(o.w)} — общее название, не имя. Пишется с маленькой буквы — <b>нарицательное</b> («нариц.»).`;
  if(i===last){if(o.kind==='N')return o.num==='ед'?`${cap(o.w)} — <b>один</b>. Значит, <b>единственное число</b> («ед. ч.»).`:`${cap(o.w)} — это <b>много</b>. Значит, <b>множественное число</b> («мн. ч.»).`;
    if(o.kind==='V')return o.num==='ед'?`${cap(o.ctx)} — один, вопрос <b>что делает?</b> — значит, <b>ед. ч.</b>`:`${cap(o.ctx)} — много, вопрос <b>что делают?</b> — значит, <b>мн. ч.</b>`;
    return o.num==='ед'?`Вопрос <b>${o.q}</b> — про один предмет (${o.ctx}). Значит, <b>ед. ч.</b>`:`Вопрос <b>какие?</b> — про много предметов (${o.ctx}). Значит, <b>мн. ч.</b>`}
  return ''}
/* картинки */
function wcard(o,pic=true){const p=pic&&o.pic?`<span class="pic">${o.pic}</span>`:'';
  if(o.kind==='N')return `<div class="wcard">${p}${o.w}</div>`;
  if(o.kind==='V')return `<div class="wcard">${p}<span class="ctx">${cap(o.ctx)}</span> <mark class="hw">${o.w}</mark></div>`;
  return `<div class="wcard">${p}<mark class="hw">${cap(o.w)}</mark> <span class="ctx">${o.ctx}</span></div>`}
function sentHTML(os){return `<div class="sent">${os.map((o,i)=>`<span class="sw"><span class="sq">(${o.q})</span><span class="ww ${PC[o.kind]}">${i?o.w:cap(o.w)}</span><span class="sl ${PC[o.kind]}">${PS[o.kind]}</span></span>`).join('')}</div>`}
/* строка разбора «как в тетради»: Котёнок — сущ. (кто?), одуш., нариц., ед. ч. */
function pline(o,state){const v=vals(o),tpl=o.kind==='N'?[0,' (',1,'), ',2,', ',3,', ',4,'.']:[0,' (',1,'), ',2,'.'];
  return `<div class="pline">${cap(o.w)} — ${tpl.map(x=>{if(typeof x==='string')return x;const s=state(x),col=x===0?' '+PC[o.kind]:'';
    if(s==='ok'||s==='new')return `<span class="pslot ok${s==='new'?' new':''}${col}" data-si="${x}">${v[x]}</span>`;
    if(s==='cur')return `<span class="pslot cur" id="ans" data-si="${x}">?</span>`;
    return `<span class="pslot" data-si="${x}">&nbsp;</span>`}).join('')}</div>`}

/* ---------- задание «разбор по плану»: ответ прилетает в окошко ---------- */
function parseTask(o,face,q,html){const v=vals(o);
  const t={type:'steps',parse:true,o,face,q,html:html||wcard(o),steps:v.map((a,i)=>({a,opts:slotOpts(o,i)})),res:''};
  t.exp=()=>`<div class="explain"><p>${hint(o,Math.min(st.step,v.length-1))}</p>${pline(o,()=>'ok')}${RRULE}</div>`;
  return t}
function renderParse(){const t=tasks[idx],n=t.steps.length;
  const state=i=>st.done||i<st.step?'ok':i===st.step?'cur':'';
  document.getElementById('stepsBox').innerHTML=t.line?t.line(state):pline(t.o,state);
  if(st.done)return;
  const opts=t.steps[st.step].opts;
  document.getElementById('ctl').innerHTML=`<div class="choices${optCls(opts)}">${opts.map(x=>`<button class="btn">${x}</button>`).join('')}</div>`;
  document.querySelectorAll('#ctl .btn').forEach(b=>b.onclick=()=>{if(st.done||document.getElementById('popbox'))return;
    const need=t.steps[st.step].a,i=st.step;
    if(b.textContent===need){const r=b.getBoundingClientRect();
      if(i<n-1){st.step++;st.tries=0;renderParse();guard(450);document.getElementById('fb').innerHTML=`<div class="praise" style="font-size:20px">Верно! ✔</div>`}
      else win();
      flyWord(r,t.steps[i].fly||need,document.querySelector(`#stepsBox [data-si="${i}"]`));
    }else{b.classList.add('off','shake');miss(need,null)}});}
/* ответ с кнопки летит по дуге в своё окошко */
function flyWord(r,text,dst){if(!dst)return;dst.style.visibility='hidden';
  const d=dst.getBoundingClientRect(),cs=getComputedStyle(dst);
  const f=document.createElement('div');f.className='jumper';f.textContent=text;
  f.style.cssText+=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;font-size:${cs.fontSize};color:${cs.color}`;
  document.body.appendChild(f);jumpSound(false);
  const dx=d.left+d.width/2-(r.left+r.width/2),dy=d.top+d.height/2-(r.top+r.height/2);
  f.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx/2}px,${dy/2-60}px) scale(1.3)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(1)`}],{duration:600,easing:'ease-in-out'})
   .onfinish=()=>{f.remove();dst.style.visibility='';dst.classList.remove('landed');void dst.offsetWidth;dst.classList.add('landed')};}

function buildRus(){const L=[],COMMON=NOUNS.filter(o=>!o.prop),PROPER=NOUNS.filter(o=>o.prop);

  // 6. Найди в предложении
  {const os=pick(SENTS),K=pick(['N','A','V']),target=os.find(o=>o.kind===K),words=os.map((o,i)=>i?o.w:cap(o.w));
   L.push({type:'choice',face:'🐻',q:`Найди в предложении <b class="${PC[K]}">${PN[K]}</b>!`,html:`<div class="wcard">${words.join(' ')}.</div>`,opts:words,ans:words[os.indexOf(target)],
     exp:()=>`<div class="explain"><p>Задаём вопрос к каждому слову:</p>${sentHTML(os)}<p>${hint(target,0)}</p></div>`});}
  // 7-9. Разбор по плану

}

const VL='аоуыэиеёюя',IOT='еёюя',VOICED='бвгджзлмнрй',ALWS='чщй',ALWH='жшц';

/* слово: буквы → звуки; st — номер ударной буквы; слоги через «-» */
function mkW([w,s,st,pic,syl]){
  const snd=s.split(' ').map(t=>{const b=t[0],v='аоуыэи'.includes(b);return {t,b,v,soft:!v&&t.endsWith("'"),voiced:!v&&VOICED.includes(b)}});
  const L=[...w],map=[];let k=0;
  L.forEach((ch,i)=>{const p=L[i-1];
    if(ch==='ь'||ch==='ъ'){map.push([]);return}
    if(IOT.includes(ch)&&(i===0||VL.includes(p)||p==='ь'||p==='ъ')){map.push([k,k+1]);k+=2;return}
    map.push([k]);k++});
  const m=map[st];snd[m[m.length-1]].stress=true;
  const nsyl=snd.filter(x=>x.v).length,sy=syl?syl.split('-'):[w];
  let sv=0;for(let i=0;i<st;i++)if(VL.includes(L[i]))sv++;
  return {w,snd,map,st,pic,syl:sy,nsyl,ssyl:sy[sv],nl:L.length,ns:snd.length,ok:k===snd.length&&nsyl===sy.length&&!!snd[m[m.length-1]].v}}

function vowWhy(x){return x.v?`[${x.t}] — <b class="sV">гласный</b> звук: его можно пропеть, воздух выходит свободно.`:`[${x.t}] — <b>согласный</b> звук: воздуху мешают губы, зубы или язык.`}
function softWhy(o,i){const c=o.w[i],n=o.w[i+1],m=o.map[i],x=o.snd[m[0]];
  if(m.length===2)return `Буква «${c}» здесь даёт два звука: [й'] и [${o.snd[m[1]].t}]. Звук [й'] — всегда <b class="sS">мягкий</b>.`;

  if(ALWH.includes(c))return `[${x.t}] — всегда <b class="sH">твёрдый</b> звук. Это надо запомнить!`;
  if(x.soft)return `После «${c}» стоит «${n}» — она смягчает звук. [${x.t}] — <b class="sS">мягкий</b>.`;
  return `${n?`После «${c}» стоит «${n}»`:`«${c}» стоит в конце слова`} — смягчать некому. [${x.t}] — <b class="sH">твёрдый</b>.`}
function voiceWhy(o,i){const c=o.w[i],x=o.snd[o.map[i][0]],p=PAIR[c];
  return `[${x.t}] — <b>${x.voiced?'звонкий':'глухой'}</b>: ${x.voiced?'горлышко дрожит, голос звенит':'горлышко не дрожит, только шум'}.${p?` Его пара — [${p}].`:' Пары у него нет.'}`}
function countWhy(o){let s=`<b>${stressW(o)}</b>: ${o.nl} ${plural(o.nl,['буква','буквы','букв'])}, ${o.ns} ${plural(o.ns,['звук','звука','звуков'])}.`;
  if(o.w.includes('ь'))s+=' Мягкий знак <b>ь</b> звука не даёт.';
  o.map.forEach((m,i)=>{if(m.length===2)s+=` Буква «${o.w[i]}» даёт два звука: [й'${o.snd[m[1]].t}].`});
  if(o.nl===o.ns)s+=' Букв и звуков поровну.';
  return s}
function sylWhy(o){return `Сколько гласных — столько и слогов: ${o.syl.join(' - ')} — <b>${o.nsyl}</b> ${plural(o.nsyl,['слог','слога','слогов'])}.`}
function stressWhy(o){return `Зовём: «${o.syl.map(s=>s===o.ssyl?`<b>${s.toUpperCase()}</b>`:s).join('-')}!» Сильнее тянется слог <b>${o.ssyl}</b>: ${stressW(o)}.`}

function buildPhon(){const L=[],FW2=FW.filter(o=>o.nsyl===2),EQ=FW.filter(o=>o.nl===o.ns);
  const single=o=>o.map.map((m,i)=>m.length===1?i:-1).filter(i=>i>=0);
  const cons=o=>single(o).filter(i=>!o.snd[o.map[i][0]].v);
  const digits=o=>[...new Set([o.nl,o.ns,o.nl+1,o.ns-1])].filter(n=>n>0).sort((a,b)=>a-b).map(String);
  // 1. Слоги
  {const o=pick(FW);L.push({type:'choice',face:'🐰',q:`Сколько слогов в слове «${o.w}»?`,html:wcardF(o,false),opts:['1','2','3'],ans:String(o.nsyl),
    exp:()=>`<div class="explain">${trHTML(o)}<p>${sylWhy(o)}</p></div>`});}
  // 2. Ударение
  {const o=pick(FW2);L.push({type:'choice',face:'🦉',q:`Позови слово «${o.w}», будто зовёшь друга. Какой слог ударный?`,html:wcardF(o,false),opts:[...o.syl],ans:o.ssyl,
    exp:()=>`<div class="explain"><p>${stressWhy(o)}</p></div>`});}
  // 3. Гласный или согласный
  {const o=pick(FW),i=pick(single(o)),x=o.snd[o.map[i][0]];
   L.push({type:'choice',face:'🐦',q:'Выделенная буква — это гласный или согласный звук?',html:wordHL(o,i),opts:['гласный','согласный'],ans:x.v?'гласный':'согласный',
    exp:()=>`<div class="explain"><p>${vowWhy(x)}</p>${trHTML(o)}</div>`});}
  // 4. Твёрдый или мягкий
  {const o=pick(FW),i=pick(cons(o)),x=o.snd[o.map[i][0]];
   L.push({type:'choice',face:'🦊',q:'Выделенная буква — твёрдый или мягкий согласный звук?',html:wordHL(o,i),opts:['твёрдый','мягкий'],ans:x.soft?'мягкий':'твёрдый',
    exp:()=>`<div class="explain"><p>${softWhy(o,i)}</p>${trHTML(o)}</div>`});}
  // 5. Звонкий или глухой
  {const o=pick(FW),i=pick(cons(o)),x=o.snd[o.map[i][0]];
   L.push({type:'choice',face:'🐻',q:'Выделенная буква — звонкий или глухой согласный? Положи ладошку на горлышко!',html:wordHL(o,i),opts:['звонкий','глухой'],ans:x.voiced?'звонкий':'глухой',
    exp:()=>`<div class="explain"><p>${voiceWhy(o,i)}</p></div>`});}
  // 6. Букв больше или звуков больше
  {const more=Math.random()<0.5,tg=pick(FW.filter(o=>more?o.nl>o.ns:o.ns>o.nl)),d=shuffle(EQ.filter(o=>o!==tg)).slice(0,3);
   L.push({type:'choice',face:'🦔',q:more?'В каком слове букв больше, чем звуков?':'В каком слове звуков больше, чем букв?',html:'<div class="story">👀👂</div>',
    opts:shuffle([tg,...d]).map(o=>o.w),ans:tg.w,exp:()=>`<div class="explain"><p>${countWhy(tg)}</p>${trHTML(tg)}<p>В остальных словах букв и звуков поровну.</p></div>`});}
  // 7. Буквы и звуки
  {const o=pick(FW.filter(o=>o.nl!==o.ns)),ds=digits(o);
   L.push(slotTask({face:'🐿️',q:'Посчитай буквы и звуки! Слушай звуки, а не смотри на буквы.',html:wcardF(o),
     steps:[{a:String(o.nl),opts:ds},{a:String(o.ns),opts:ds}],
     line:s=>`<div class="prow">Букв: ${slot(0,s,o.nl)} &nbsp; Звуков: ${slot(1,s,o.ns)}</div>`,
     hint:i=>i===0?`Буквы считаем глазами: ${[...o.w].join(', ')} — <b>${o.nl}</b>.`:countWhy(o),extra:()=>trHTML(o)}));}
  // 8. Звуковая схема
  {const o=pick(FW),ok=schemeEmo(o),set=new Set([ok]);let g=0;
   while(set.size<3&&g++<60){const a=o.snd.map(x=>({...x})),j=R(0,a.length-1);
     if(a[j].v){a[j].v=false;a[j].soft=Math.random()<0.5}else if(Math.random()<0.7)a[j].soft=!a[j].soft;else a[j].v=true;
     set.add(a.map(semo).join(''))}
   L.push({type:'choice',face:'🐰',q:`Какая звуковая схема у слова «${o.w}»?`,html:wcardF(o)+`<div class="legend">🟥 гласный &nbsp; 🟦 твёрдый согласный &nbsp; 🟩 мягкий согласный</div>`,
     opts:shuffle([...set]),ans:ok,exp:()=>`<div class="explain"><p>Каждый звук — один квадратик:</p>${trHTML(o)}${schemeHTML(o)}<p>${countWhy(o)}</p></div>`});}
  // 9. Прав ли ёжик
  {const o=pick(FW),ok=Math.random()<0.5;let n=o.ns;if(!ok)n=o.nl!==o.ns?o.nl:o.ns+pick([-1,1]);
   L.push({type:'tf',face:'🦔',q:'Ёжик Колючкин посчитал звуки. Он прав или ошибся?',
     html:wcardF(o)+`<div class="bubble" style="text-align:center;margin:6px 0">«В слове <b>${o.w}</b> ${n} ${plural(n,['звук','звука','звуков'])}»</div>`,
     isOk:ok,r:`${o.ns} ${plural(o.ns,['звук','звука','звуков'])}`,exp:()=>`<div class="explain"><p>${countWhy(o)}</p>${trHTML(o)}</div>`});}
  // 10. Разбор по плану
  {const o=pick(FW2),ds=digits(o);
   L.push(slotTask({face:'🦉',q:'Разбери слово по плану! Нажимай ответы — они прилетят в окошки.',html:wcardF(o,false),
     steps:[{a:String(o.nsyl),opts:['1','2','3']},{a:o.ssyl,opts:[...o.syl]},{a:String(o.nl),opts:ds},{a:String(o.ns),opts:ds}],
     line:s=>`<div class="prow">Слогов: ${slot(0,s,o.nsyl)} &nbsp; Ударный: ${slot(1,s,o.ssyl)}<br>Букв: ${slot(2,s,o.nl)} &nbsp; Звуков: ${slot(3,s,o.ns)}</div>`,
     hint:i=>[sylWhy(o),stressWhy(o),`Буквы считаем глазами: ${[...o.w].join(', ')} — <b>${o.nl}</b>.`,countWhy(o)][i],extra:()=>trHTML(o)}));}
  // 11. Звуки по очереди (короткое слово)
  {const o=pick(FW.filter(o=>o.ns===3));
   L.push(slotTask({face:'🐻',q:'Какой каждый звук? Гласный, твёрдый или мягкий согласный?',html:wcardF(o),
     steps:o.snd.map(x=>({a:x.v?'гласный':x.soft?'мягкий':'твёрдый',opts:['гласный','твёрдый','мягкий'],fly:x.t})),
     line:s=>`<div class="tr">[ ${o.snd.map((x,i)=>slot(i,s,sndT(x,o),scls(x))).join(' ')} ]</div>`,
     hint:i=>{const x=o.snd[i];return x.v?vowWhy(x):softWhy(o,o.map.findIndex(m=>m.includes(i)))},extra:()=>schemeHTML(o)}));}
  // 12. Финал: длинное слово
  {const o=pick(FW.filter(o=>o.ns===4));
   L.push(slotTask({face:'🏆',q:'Последнее задание! Какой каждый звук: гласный, твёрдый или мягкий согласный?',html:wcardF(o),
     steps:o.snd.map(x=>({a:x.v?'гласный':x.soft?'мягкий':'твёрдый',opts:['гласный','твёрдый','мягкий'],fly:x.t})),
     line:s=>`<div class="tr">[ ${o.snd.map((x,i)=>slot(i,s,sndT(x,o),scls(x))).join(' ')} ]</div>`,
     hint:i=>{const x=o.snd[i];return x.v?vowWhy(x):softWhy(o,o.map.findIndex(m=>m.includes(i)))},extra:()=>schemeHTML(o)}));}
  return mixTasks(L);
}

/* таблица разбора звуков «как в тетради» */
function ftab(o,upto){let h='<div class="ftab">';
  [...o.w].forEach((c,i)=>{if(i>upto)return;const m=o.map[i],nw=i===upto?' new':'';
    const s=m.length?m.map(k=>`<span class="${scls(o.snd[k])}">[${sndT(o.snd[k],o)}]</span>`).join(' '):'—';
    const d=m.length?m.map(k=>{const x=o.snd[k];return x.v?`гласный, ${x.stress?'ударный':'безударный'}`:`согласный, ${x.soft?'мягкий':'твёрдый'}, ${x.voiced?'звонкий':'глухой'}`}).join('; '):'звука нет';
    h+=`<span class="fl${nw}">${c}</span><span class="fs${nw}">${s}</span><span class="${nw}">${d}</span>`});
  return h+'</div>'}

/* ================= МАТЕМАТИКА: умножение (2 класс) ================= */
const MRULE=`<div class="rule">Умножение — это сумма одинаковых слагаемых!</div>`;
const groups=(a,k,e='🌰')=>`<div class="groups">${Array(k).fill(`<span class="grp">${e.repeat(a)}</span>`).join('')}</div>`;
const arr=(r,c,e='🌰')=>`<div class="center"><div class="arr" style="grid-template-columns:repeat(${c},auto)">${`<span>${e}</span>`.repeat(r*c)}</div></div>`;
const sumStr=(a,b)=>Array(b).fill(a).join(' + ');
const rz=b=>plural(b,['раз','раза','раз']);
const mExpr=(s,box=true)=>`<div class="expr"><span class="t">${s}</span>${box?'<span class="t"><span class="box" id="ans">?</span></span>':''}</div>`;
function explM(a,b,pre=''){const r=a*b;let s=pre?`<p>${pre}</p>`:'';
  if(b===0)s+=`<p>По ${a} взять <b>0 раз</b> — ничего не взяли. ${a} · 0 = <b>0</b>.</p>`;
  else if(a===0)s+=`<p>По 0 взять ${b} ${rz(b)}: ${sumStr(0,b)} = <b>0</b>. С нулём всегда 0!</p>`;
  else{s+=`<p>${a} · ${b} — это по <b>${a}</b> взять <b>${b}</b> ${rz(b)}:</p><p class="center"><b>${sumStr(a,b)} = ${r}</b></p>`;if(r<=20&&b<=5)s+=groups(a,b)}
  return `<div class="explain">${s}${MRULE}</div>`}
/* квадрат Пифагора: строка r и столбик c подсвечены */
function pyth(r,c){let h='<div class="pyth"><span class="ph">·</span>';
  for(let j=1;j<=9;j++)h+=`<span class="ph${j===c?' pc':''}">${j}</span>`;
  for(let i=1;i<=9;i++){h+=`<span class="ph${i===r?' pr':''}">${i}</span>`;
    for(let j=1;j<=9;j++)h+=`<span class="${i===r&&j===c?'px':i===r?'prl':j===c?'pcl':''}">${i*j}</span>`}
  return h+'</div>'}

    `<p class="big">У чисел есть имена:</p><div class="sent"><span class="sw"><span class="ww">2</span><span class="sl">множитель</span></span><span class="sw"><span class="ww">·</span></span><span class="sw"><span class="ww">4</span><span class="sl">множитель</span></span><span class="sw"><span class="ww">=</span></span><span class="sw"><span class="ww cR">8</span><span class="sl">произведение</span></span></div>`,
    `<p class="big">Первое число — <b>сколько в каждой кучке</b>.<br>Второе — <b>сколько кучек</b> (сколько раз).</p>${groups(3,2)}${plainExpr('3 · 2 = 6')}`]},
  {title:'Сумму — в произведение',face:'🦊',chunks:[
    `<p class="big">Если слагаемые <b>одинаковые</b>, сумму можно заменить произведением:</p><div class="plist">3 + 3 + 3 + 3 = <b>3 · 4</b><br>5 + 5 = <b>5 · 2</b><br>4 + 4 + 4 = <b>4 · 3</b></div>`,
    `<p class="big">А если слагаемые <b>разные</b> — заменить нельзя:</p><div class="plist">2 + 3 + 4 — ❌</div><p class="big">Умножение — только для одинаковых!</p>`,
    `<p class="big">Как найти <b>3 · 4</b>? Заменим сложением:</p><div class="plist">3 · 4 = 3 + 3 + 3 + 3 = <b>12</b></div>${groups(3,4)}`]},
  {title:'Переставляем множители',face:'🐻',chunks:[
    `<p class="big">Орешки лежат <b>2 ряда</b>, в каждом по <b>3</b>:</p>${arr(2,3)}${plainExpr('3 · 2 = 6')}`,
    `<p class="big">Повернём картинку: <b>3 ряда</b> по <b>2</b>:</p>${arr(3,2)}${plainExpr('2 · 3 = 6')}<p class="big center">Орешков столько же!</p>`,
    `<div class="rule" style="font-size:22px">От перестановки множителей произведение не меняется!</div>${plainExpr('2 · 3 = 3 · 2')}`]},
  {title:'Умножение на 1 и на 0',face:'🐰',chunks:[
    `<p class="big">По 5 взять <b>1 раз</b> — будет 5:</p>${plainExpr('5 · 1 = 5')}<p class="big">А 1 · 5 = 1 + 1 + 1 + 1 + 1 = <b>5</b>.</p><p class="big center">На 1 умножаем — число не меняется!</p>`,
    `<p class="big">В 3 корзинках <b>нет</b> орешков — по 0:</p><div class="story">🧺 🧺 🧺</div>${plainExpr('0 · 3 = 0')}<p class="big center">И 3 · 0 = 0. С нулём всегда <b>0</b>!</p>`]},
  {title:'Вся таблица умножения',face:'🦉',chunks:[
    `<p class="big">Вся таблица умножения — в одном квадрате! Найди строку <b class="cT">7</b> и столбик <b class="cU">8</b> — на пересечении ответ:</p>${pyth(7,8)}<p class="big center">7 · 8 = <span class="cA">56</span></p>`,
    `<p class="big">Переставим множители — ответ тот же:</p><div class="plist">7 · 8 = 56<br>8 · 7 = 56</div><p class="big center">Знаешь одно — знаешь и другое! Половина таблицы уже выучена 😉</p>`,
    `<p class="big">Забыл ответ? Прибавь число к прошлому ответу:</p><div class="plist">6 · 7 = 42<br>6 · 8 = 42 + 6 = <b>48</b></div>`]},
  {title:'Хитрости таблицы',face:'🐿️',chunks:[
    `<p class="big">На <b>5</b>: ответы всегда кончаются на <b>0</b> или <b>5</b>:</p><div class="plist">5, 10, 15, 20, 25, 30, 35, 40, 45</div>`,
    `<p class="big">На <b>9</b>: сумма цифр ответа всегда <b>9</b>:</p><div class="plist">9 · 4 = 36 → 3 + 6 = 9<br>9 · 7 = 63 → 6 + 3 = 9</div><p class="big center">А первая цифра на 1 меньше второго множителя: 9 · <b>7</b> = <b>6</b>3</p>`,
    `<p class="big">На <b>4</b>: умножь на 2, а потом ещё раз на 2:</p><div class="plist">4 · 6: 6 · 2 = 12, 12 · 2 = <b>24</b></div>`]},
  {title:'Осторожно, ловушка!',face:'🦔',chunks:[
    `<p class="big">Ёжик Колючкин торопился и решил:</p>${plainExpr('3 · 4 = <s style="color:#e0245e">7</s>')}<p class="big">Он <b>сложил</b> 3 и 4, а надо было <b>умножить</b>!</p>`,
    `<p class="big">3 · 4 — это по 3 взять 4 раза:</p><div class="plist">3 + 3 + 3 + 3 = <b>12</b></div>${groups(3,4)}`,
    `${MRULE.replace('class="rule"','class="rule" style="font-size:24px"')}<p class="big center">Ты всё знаешь! Теперь можно играть 🎮</p>`]}
];
function buildMul(){const L=[],EMO=['🌰','🍎','🍄','🌸','⭐','🥕'];
  const tab=n=>{const b=R(2,9);return Math.random()<0.5?[n,b]:[b,n]};
  const uniq=(arr,n=4)=>[...new Set(arr)].slice(0,n);
  // 1. Картинка → запись
  {const a=R(2,4),k=R(2,4),e=pick(EMO),ok=`${a} · ${k}`;
   L.push({type:'choice',face:'🐿️',q:`В ${k} ${plural(k,['кучке','кучках','кучках'])} по ${a}. Какая запись подходит?`,html:groups(a,k,e),
     opts:shuffle(uniq([ok,`${a} + ${k}`,`${a+1} · ${k}`,`${a} · ${k+1}`,`${a} · ${k+2}`])),ans:ok,
     exp:()=>explM(a,k,`В каждой кучке по <b>${a}</b>, кучек <b>${k}</b>. Записываем: <b>${ok}</b>.`)});}
  // 2. Сумму — в произведение
  {const a=R(2,5),b=R(2,4),ds=[...new Set([a,b,a+1,b+1])].sort((x,y)=>x-y).map(String);
   L.push(slotTask({face:'🦊',q:'Замени сумму произведением! Нажимай числа — они прилетят в окошки.',html:'',
     steps:[{a:String(a),opts:ds},{a:String(b),opts:ds}],
     line:s=>`<div class="prow" style="font-size:26px">${sumStr(a,b)} = ${slot(0,s,a)} · ${slot(1,s,b)}</div>`,
     hint:i=>i===0?`Складываем одинаковые числа <b>${a}</b> — первым пишем ${a}.`:`Число ${a} повторяется <b>${b}</b> ${rz(b)} — вторым пишем ${b}.`,extra:()=>MRULE}));}
  // 3. Произведение — в сумму
  {const a=R(2,5),b=R(2,4),ok=sumStr(a,b);
   L.push({type:'choice',face:'🐰',q:`Какая сумма подходит к записи ${a} · ${b}?`,html:plainExpr(`${a} · ${b}`),cls:' one',
     opts:shuffle(uniq([ok,`${a} + ${b}`,sumStr(a,b+1),sumStr(a,b-1),sumStr(a+1,b),sumStr(a,b+2)].filter(x=>x.includes('+')))),ans:ok,exp:()=>explM(a,b)});}
  // 4-5. Таблица умножения: сначала полегче, потом потруднее
  for(const [lo,hi,face,q] of [[2,5,'🐻','Таблица умножения! Посчитай:'],[6,9,'🦉','Задание потруднее! Посчитай:']]){const [a,b]=tab(R(lo,hi));
    L.push({type:'num',face,q,html:mExpr(`${a} · ${b} =`),ans:a*b,exp:()=>tabExp(a,b)});}
  // 6. На 1 и на 0
  {const x=R(2,9),[a,b]=pick([[x,0],[0,x],[x,1],[1,x]]);
   L.push({type:'num',face:'🐰',q:'Хитрый пример! Подумай, что бывает с 0 и с 1.',html:mExpr(`${a} · ${b} =`),ans:a*b,
     exp:()=>`<div class="explain"><p>${a*b===0?'Если один из множителей <b>0</b> — произведение всегда <b>0</b>.':'Если умножаем на <b>1</b> — число не меняется.'}</p><p class="center"><b>${a} · ${b} = ${a*b}</b></p></div>`});}
  // 7. Переставь множители
  {const [a,b]=tab(R(2,9));
   L.push({type:'num',face:'🐻',q:'Мишка переставил множители. Какое число спряталось?',html:`<div class="expr"><span class="t">${a} · ${b} = ${b} ·</span><span class="t"><span class="box" id="ans">?</span></span></div>`,ans:a,
     exp:()=>`<div class="explain"><p>От перестановки множителей произведение не меняется:</p><p class="center"><b>${a} · ${b} = ${b} · ${a}</b></p>${a*b<=20?arr(Math.min(a,b),Math.max(a,b)):''}</div>`});}
  // 8. Прав ли ёжик
  {const [a,b]=tab(R(3,9)),ok=Math.random()<0.5,shown=ok?a*b:pick([a+b,a*b+a,a*b-b].filter(x=>x!==a*b&&x>0));
   L.push({type:'tf',face:'🦔',q:'Ёжик Колючкин решил пример. Он прав или ошибся?',html:plainExpr(`${a} · ${b} = ${shown}`),isOk:ok,r:a*b,
     exp:()=>tabExp(a,b,ok?'Ёжик решил <b>правильно</b>!':`Ёжик ${shown===a+b?'<b>сложил</b> числа, а надо умножить':'ошибся'}. Правильно: <b>${a*b}</b>.`)});}
  // 9. Какой рисунок подходит
  {const a=R(2,3),b=R(2,4),e=pick(EMO),pic=(x,k)=>Array(k).fill(`(${e.repeat(x)})`).join(' '),ok=pic(a,b);
   L.push({type:'choice',face:'🐿️',q:`Какой рисунок подходит к записи ${a} · ${b}?`,html:plainExpr(`${a} · ${b}`),cls:' one emo',
     opts:shuffle(uniq([ok,pic(a+1,b),pic(a,b+1),`(${e.repeat(a)}) (${e.repeat(b)})`])),ans:ok,
     exp:()=>explM(a,b,`${a} · ${b} — это <b>${b}</b> ${plural(b,['кучка','кучки','кучек'])} по <b>${a}</b>.`)});}
  // 10. Считаем двойками / тройками
  {const s=R(2,9),h=R(2,4),seq=[1,2,3,4,5,6].map(k=>k*s);
   L.push({type:'num',face:'🦊',q:`Считаем ${['двойками','тройками','четвёрками','пятёрками','шестёрками','семёрками','восьмёрками','девятками'][s-2]}! Какое число пропало?`,
     html:`<div class="expr" style="flex-wrap:wrap">${seq.map((v,i)=>i===h?'<span class="t"><span class="box" id="ans">?</span></span>':`<span class="t">${v}${i<5?',':''}</span>`).join('')}</div>`,ans:seq[h],
     exp:()=>`<div class="explain"><p>Каждое число больше прошлого на <b>${s}</b>: ${seq[h-1]} + ${s} = <b>${seq[h]}</b>.</p><p>Это таблица на ${s}: ${s} · ${h+1} = <b>${seq[h]}</b>.</p></div>`});}
  // 11. Пропущенный множитель
  {const a=R(2,9),b=R(2,9);
   L.push({type:'num',face:'🐰',q:'Какой множитель спрятался?',html:`<div class="expr"><span class="t">${a} ·</span><span class="t"><span class="box" id="ans">?</span></span><span class="t">= ${a*b}</span></div>`,ans:b,
     exp:()=>tabExp(a,b,`Ищем: по ${a} взять сколько раз, чтобы получилось ${a*b}?`)});}
  // 12. Задача
  {const a=R(2,9),b=R(2,7);
   L.push({type:'num',face:'🐦',q:'Задача!',html:`<div class="bubble" style="margin:6px 0">На ${b} ${plural(b,['ветке','ветках','ветках'])} сидят птички, на каждой — по ${a}. Сколько всего птичек?</div>${a*b<=15&&b<=4?groups(a,b,'🐦'):''}<div class="expr"><span class="t">Ответ:</span><span class="box" id="ans">?</span></div>`,ans:a*b,
     exp:()=>explM(a,b,`«По ${a}» взять ${b} ${rz(b)} — значит, <b>умножаем</b>: ${a} · ${b}.`)});}
  // 12. Финал: задача в два шага
  {const a=R(2,9),b=R(2,9),c=R(1,9);
   L.push({type:'steps',face:'🏆',q:`Последнее задание! В ${b} ${plural(b,['корзинке','корзинках','корзинках'])} по ${a} ${plural(a,['гриб','гриба','грибов'])}. Ещё ${c} ${plural(c,['гриб','гриба','грибов'])} Пушинка нашла под ёлкой. Сколько всего грибов?`,html:'',
     steps:[{l:`Шаг 1: ${a} · ${b} =`,a:a*b},{l:`Шаг 2: ${a*b} + ${c} =`,a:a*b+c}],res:a*b+c,
     exp:()=>`<div class="explain"><p><b>Шаг 1.</b> В корзинках по ${a} взять ${b} ${rz(b)}: ${a} · ${b} = <b>${a*b}</b>.</p><p><b>Шаг 2.</b> Прибавим грибы под ёлкой: ${a*b} + ${c} = <b>${a*b+c}</b>.</p></div>`});}
  return mixTasks(L);
}

  {id:'math',icon:'🔢',name:'Математика',sub:'числа и примеры',topics:[

     intro:'Сегодня учимся складывать и вычитать<br><b>десятки и единицы</b>.',tsub:'Пушинка объяснит, как решать',lessons:MATH_LESSONS,build:buildTasks,rule:RULE,
     master:'Ты настоящий мастер десятков и единиц! 🧠✨',p1:'Вот это да! Настоящий математик! 🧠',p2:'Отлично считаешь! 💪'},
    {subj:'math',icon:'✖️',name:'Умножение',sub:'что это такое, вся таблица умножения',story:'🐿️🌰🌰🌰',h1:'Пушинка считает кучками!',
     intro:'Учимся <b>умножать</b>!',tsub:'Пушинка объяснит, что такое умножение',lessons:MUL_LESSONS,build:buildMul,rule:MRULE,
     master:'Ты настоящий мастер умножения! 🧠✨',p1:'Вот это да! Настоящий математик! 🧠',p2:'Отлично умножаешь! 💪'}]},

    {subj:'rus',icon:'🔔',name:'Фонетический разбор',sub:'звуки и буквы, слоги, ударение',story:'🐿️👂🔔',h1:'Пушинка слушает звуки!',
     intro:'Учимся делать <b>фонетический разбор</b> слова!',tsub:'Пушинка расскажет про звуки и буквы',lessons:PH_LESSONS,build:buildPhon,rule:PRULE,
     master:'Ты настоящий знаток звуков и букв! 👂✨',p1:'Вот это слух! Настоящий знаток звуков! 👂',p2:'Отлично слышишь звуки! 💪'}]}
